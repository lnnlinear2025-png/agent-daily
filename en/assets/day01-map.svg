t="44" rx="10" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/><text x="1367.9" y="104.1" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">① What is an Agent</text></a><rect x="1547.4" y="12.0" width="422.2" height="34" rx="17" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/><text x="1758.6" y="34.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2433">Definition: acts on its own toward your goal</text><rect x="1547.4" y="58.0" width="406.2" height="34" rx="17" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/><text x="1750.6" y="80.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2433">Loop: observe → choose → use tools → check</text><rect x="1547.4" y="104.0" width="377.4" height="34" rx="17" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/><text x="1736.2" y="126.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2433">Boundary: only within the rules you set</text><rect x="1547.4" y="150.0" width="422.2" height="34" rx="17" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/><text x="1758.6" y="172.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2433">Not agents: one-shot chatbots, fixed scripts</text><a href="#s2"><rect x="1224.4" y="263.0" width="287.0" height="44" rx="10" fill="#d97706" stroke="#d97706" stroke-width="1.5"/><text x="1367.9" y="291.1" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">② Three Steps</text></a><rect x="1547.4" y="222.0" width="334.6" height="34" rx="17" fill="#fff" stroke="#d97706" stroke-width="1.5"/><text x="1714.7" y="244.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2433">Basics: LLM · Prompt · API · Token</text><rect x="1547.4" y="268.0" width="333.9" height="34" rx="17" fill="#fff" stroke="#d97706" stroke-width="1.5"/><text x="1714.4" y="290.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2433">Build: Tools · Agent Loop · Memory</text><rect x="1547.4" y="314.0" width="414.6" height="34" rx="17" fill="#fff" stroke="#d97706" stroke-width="1.5"/><text x="1754.7" y="336.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2433">Make it reliable: Permissions · Eval · HITL</text><a href="#s3"><rect x="1224.4" y="473.0" width="287.0" height="44" rx="10" fill="#0891b2" stroke="#0891b2" stroke-width="1.5"/><text x="1367.9" y="501.1" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">③ Map Structure</text></a><rect x="1547.4" y="386.0" width="279.5" height="34" rx="17" fill="#fff" stroke="#0891b2" stroke-width="1.5"/><text x="1687.2" y="408.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2433">10 stations: Stage 0–8 + 7.5</text><rect x="1547.4" y="432.0" width="298.1" height="34" rx="17" fill="#fff" stroke="#0891b2" stroke-width="1.5"/><text x="1696.5" y="454.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2433">Shared basics: Stage 0 → 1 → 2</text><rect x="1547.4" y="478.0" width="314.7" height="34" rx="17" fill="#fff" stroke="#0891b2" stroke-width="1.5"/><text x="1704.8" y="500.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2433">Track A: use existing CLI agents</text><rect x="1547.4" y="524.0" width="287.8" height="34" rx="17" fill="#fff" stroke="#0891b2" stroke-width="1.5"/><text x="1691.4" y="546.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2433">Track B: build your own agent</text><rect x="1547.4" y="570.0" width="261.0" height="34" rx="17" fill="#fff" stroke="#0891b2" stroke-width="1.5"/><text x="1677.9" y="592.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2433">5 role paths: read by role</text><a href="#s6"><rect x="498.4" y="122.0" width="287.0" height="44" rx="10" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/><text x="641.9" y="150.1" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">⑥ Hands-on: Claude / Codex</text></a><rect x="38.9" y="58.0" width="423.5" height="34" rx="17" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><text x="250.6" y="80.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2433">Does: read files · edit files · run commands</text><rect x="47.8" y="104.0" width="414.6" height="34" rx="17" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><text x="255.1" y="126.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2433">Uses: merge sheets · read docs · draft text</text><rect x="74.1" y="150.0" width="388.3" height="34" rx="17" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><text x="268.2" y="172.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2433">Where: desktop app · CLI · plugins · web</text><rect x="12.0" y="196.0" width="450.4" height="34" rx="17" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><text x="237.2" y="218.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2433">Tips: be specific · ask for proof · Esc to stop</text><a href="#s5"><rect x="498.4" y="309.0" width="287.0" height="44" rx="10" fill="#db2777" stroke="#db2777" stroke-width="1.5"/><text x="641.9" y="337.1" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">⑤ How to Learn</text></a><rect x="264.2" y="268.0" width="198.2" height="34" rx="17" fill="#fff" stroke="#db2777" stroke-width="1.5"/><text x="363.3" y="290.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2433">One Stage at a time</text><rect x="165.6" y="314.0" width="296.8" height="34" rx="17" fill="#fff" stroke="#db2777" stroke-width="1.5"/><text x="314.0" y="336.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2433">Run it first, change one thing</text><rect x="138.7" y="360.0" width="323.7" height="34" rx="17" fill="#fff" stroke="#db2777" stroke-width="1.5"/><text x="300.6" y="382.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2433">Meet the done-check, then move on</text><a href="#s4"><rect x="498.4" y="473.0" width="287.0" height="44" rx="10" fill="#059669" stroke="#059669" stroke-width="1.5"/><text x="641.9" y="501.1" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">④ Key Terms</text></a><rect x="199.5" y="432.0" width="262.9" height="34" rx="17" fill="#fff" stroke="#059669" stroke-width="1.5"/><text x="331.0" y="454.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2433">LLM · Prompt · Token · API</text><rect x="281.4" y="478.0" width="181.0" height="34" rx="17" fill="#fff" stroke="#059669" stroke-width="1.5"/><text x="371.9" y="500.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2433">Tool · Agent Loop</text><rect x="182.9" y="524.0" width="279.5" height="34" rx="17" fill="#fff" stroke="#059669" stroke-width="1.5"/><text x="322.6" y="546.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2433">Eval · HITL (human approval)</text><rect x="833.4" y="269.0" width="343.0" height="78" rx="16" fill="#1f2433" stroke="#1f2433" stroke-width="1.5"/><text x="1004.9" y="304.0" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">The AI Agent Big Picture</text><text x="1004.9" y="328.0" text-anchor="middle" font-size="14" fill="#fff" opacity=".8">What it is · How to learn · Which path</text></svg>